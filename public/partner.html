:root{--bg:#f2f7f8;--card:#fff;--ink:#0c2a3a;--muted:#5b7280;--line:#dbe7ea;--sea:#0b7285;--sea2:#0e8fa3;--tint:#dceef1;--sun:#f59e0b;--sun2:#fff4dc;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2b;--ink:#eef6ff;--muted:#9aa8bd;--line:#26344d;--sea:#2dd4bf;--sea2:#14b8a6;--tint:#12313a;--sun:#fbbf24;--sun2:#2a2108;--ok:#4ade80}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
.brand{font-weight:900;font-size:17px;color:var(--sea)}.brand span{color:var(--muted);font-weight:700;font-size:13px;margin-left:6px}
.hello{font-size:22px;font-weight:900;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.pts{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;border:0}
.pts .lbl{font-size:13px;opacity:.9;font-weight:700}
.pts .big{font-size:44px;font-weight:900;line-height:1.1;margin:4px 0}
.pts .row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.95}
.pts .row b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:900;color:var(--sea)}.tile span{font-size:12px;color:var(--muted);font-weight:700}
.link{display:flex;gap:8px;align-items:center}
.link input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 14px ui-monospace,monospace;padding:0 10px}
.btn{height:44px;border-radius:12px;border:0;padding:0 14px;font:800 14px inherit;background:var(--sea);color:#fff;cursor:pointer}
h2{font-size:15px;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--muted);font-size:12px;font-weight:700}
.chart{width:100%;height:140px;display:block}
.chart .bar{fill:var(--sea)}.chart .bar.o{fill:var(--sun)}
.chart .ax{fill:var(--muted);font-size:9px}
.chart .grid{stroke:var(--line);stroke-width:1}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:800 13px inherit}
.tabs button.on{background:var(--sea);border-color:var(--sea);color:#fff}
.pay{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.pay:first-of-type{border-top:0}.pay b{font-size:15px}.pay .p{color:var(--sun);font-weight:900;text-align:right}.pay .m{color:var(--muted)}
.sec{margin-top:16px;font-size:13px;font-weight:900;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.off{background:#fee2e2;color:#991b1b;border-radius:12px;padding:10px;font-weight:800;font-size:13px;margin-top:12px}
[dir=rtl] .pay .p{text-align:left}
</style>
</head>
