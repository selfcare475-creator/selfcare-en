<style>
:root{
  --bg:#eef3f9;--card:#ffffff;--ink:#1d2340;--muted:#8a93ad;--line:#e8edf5;

}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 6px}
.hello{color:var(--muted);font-size:14px;font-weight:600}
.name{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(76,95,213,.35);flex:none}
.chips{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.chip b{color:var(--ink)}
.chip.brand{color:var(--blue)}
.off{background:var(--redBg);color:var(--red);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:118px}
.stat .hd{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .hd span.t{overflow:hidden;text-overflow:ellipsis}
.stat .ft{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.ic svg{width:16px;height:16px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:8px 0 8px;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:700}
.pill.up{background:var(--greenBg);color:var(--green)}.pill.dn{background:var(--redBg);color:var(--red)}.pill.eq{background:var(--line);color:var(--muted)}
.hero{margin-top:14px;border-radius:24px;padding:18px 16px 12px;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 18px 40px rgba(76,95,213,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:14px;font-weight:700;opacity:.95}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:6px 0 2px}
.hero .big small{font-size:16px;font-weight:700;opacity:.85;margin-left:6px}
.hero .money{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 14px;margin:12px 0 10px}
.hero .money span{font-size:13px;font-weight:700;opacity:.9}
.hero .money b{font-size:24px;font-weight:800}.hero .money b small{font-size:13px;opacity:.85}
.hero .meta{font-size:12.5px;opacity:.85;font-weight:600}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.legend{display:flex;gap:14px;font-size:11.5px;font-weight:700;opacity:.9;margin:12px 0 4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.bars{width:100%;height:120px;display:block}
.bars text{fill:rgba(255,255,255,.75);font-size:9px;font-family:inherit}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h3{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-size:12px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
.seg{display:flex;gap:8px;margin:14px 0 6px;overflow-x:auto}
.seg button{flex:none;border:0;border-radius:99px;padding:8px 14px;font:700 13px inherit;background:var(--bg);color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--sky),#22a6e6);color:#fff;box-shadow:0 6px 14px rgba(56,189,248,.35)}
.seg button i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.line{width:100%;height:170px;display:block;overflow:visible}
.line text{fill:var(--muted);font-size:9px;font-family:inherit}
.tip{font:700 11px inherit}
.link{display:flex;gap:8px;margin-top:12px}
.link input{flex:1;min-width:0;height:46px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);font:700 14px "Plus Jakarta Sans",monospace;padding:0 14px}
.btn{height:46px;border-radius:14px;border:0;padding:0 16px;font:800 14px inherit;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(76,95,213,.3)}
.btn.ghost{background:var(--bg);color:var(--blue);box-shadow:none}
.pay{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0;padding-top:8px}
.pay .ic{width:40px;height:40px;border-radius:13px;background:var(--i3b);color:var(--i3)}
.pay .ic svg{width:20px;height:20px}
.pay .t{flex:1;min-width:0}.pay .t b{display:block;font-size:14px;font-weight:800}.pay .t span{font-size:12px;color:var(--muted);font-weight:600}

.empty{color:var(--muted);text-align:center;padding:18px 8px;font-weight:600;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:16px 4px 0;line-height:1.6;font-weight:500}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;font-weight:600}
.loading{padding:120px 0;text-align:center;color:var(--muted);font-weight:700}

      s += '<rect x="' + (cx + 1).toFixed(1) + '" y="' + (H - pb - ho).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + ho.toFixed(1) + '" rx="' + (bw / 2).toFixed(1) + '" fill="#f7d154"><title>' + dd(d.d) + ' · ' + L.cb + ': ' + d.o + '</title></rect>';
      if(i % 3 === 0) s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle">' + dt(d.d + "T12:00:00", {day:"numeric", month:"numeric"}) + '</text>';
    });
    return s + '</svg>';
  }
  function line(days, key){
    var W = 320, H = 170, pl = 26, pr = 6, pt = 30, pb = 18, n = days.length;
    var vals = days.map(function(d){ return +d[key] || 0; }), max = Math.max(1, Math.max.apply(null, vals));
    var nice = Math.ceil(max / 4) * 4 || 4;
    var X = function(i){ return pl + (W - pl - pr) * i / (n - 1); }, Y = function(v){ return pt + (H - pt - pb) * (1 - v / nice); };
    var pts = vals.map(function(v, i){ return [X(i), Y(v)]; });
    var d = "M" + pts[0][0] + "," + pts[0][1];
    for(var i = 1; i < pts.length; i++){ var p0 = pts[i - 1], p1 = pts[i], cx = (p0[0] + p1[0]) / 2; d += " C" + cx + "," + p0[1] + " " + cx + "," + p1[1] + " " + p1[0] + "," + p1[1]; }
    var s = '<svg class="line" viewBox="0 0 ' + W + ' ' + H + '"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c5fd5" stop-opacity=".28"/><stop offset="1" stop-color="#4c5fd5" stop-opacity="0"/></linearGradient></defs>';
    for(var g = 0; g <= 4; g++){ var gy = Y(nice * g / 4); s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '" stroke="#e8edf5"/><text x="' + (pl - 6) + '" y="' + (gy + 3) + '" text-anchor="end">' + num(nice * g / 4) + '</text>'; }
    s += '<path d="' + d + ' L' + X(n - 1) + ',' + Y(0) + ' L' + X(0) + ',' + Y(0) + ' Z" fill="url(#ga)"/>';
    s += '<path d="' + d + '" fill="none" stroke="#4c5fd5" stroke-width="2.6" stroke-linecap="round"/>';
    [0, 7, 14, 21, n - 1].forEach(function(i){ s += '<text x="' + X(i) + '" y="' + (H - 3) + '" text-anchor="middle">' + dt(days[i].d + "T12:00:00", {day:"numeric", month:"short"}) + '</text>'; });
    var mi = vals.lastIndexOf(Math.max.apply(null, vals));
    if(vals[mi] > 0){
      var mx = X(mi), my = Y(vals[mi]), lab = num(vals[mi]), tw = Math.max(34, lab.length * 7 + 16), tx = Math.min(Math.max(mx - tw / 2, pl), W - pr - tw);
      s += '<line x1="' + mx + '" x2="' + mx + '" y1="' + my + '" y2="' + Y(0) + '" stroke="#4c5fd5" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/>';
      s += '<rect x="' + tx + '" y="' + (my - 28) + '" width="' + tw + '" height="20" rx="7" fill="#4c5fd5"/><text class="tip" x="' + (tx + tw / 2) + '" y="' + (my - 14) + '" text-anchor="middle" fill="#fff" style="fill:#fff;font-size:11px;font-weight:800">' + lab + '</text>';
      s += '<circle cx="' + mx + '" cy="' + my + '" r="5" fill="#fff" stroke="#4c5fd5" stroke-width="3"/>';
    }
    return s + '</svg>';
  }
  function render(){
    var b = D.balance || {}, a = D.all_time || {}, days = D.days || [];
    var last7 = days.slice(-7), prev7 = days.slice(-14, -7);
    var h = '<div class="top"><div><div class="hello">' + L.hi + '</div><div class="name">' + esc(D.name) + ' 👋</div></div><div class="avatar">' + esc(initials(D.name)) + '</div></div>';
    h += '<div class="chips"><span class="chip brand">Self Care Pharmacy · ' + L.partner + '</span><span class="chip">' + L.code + ' <b>' + D.code + '</b></span>' + (D.demo ? '<span class="chip" style="background:#fff3cd;color:#8a5a00">Demo</span>' : '') + '</div>';
    if(!D.active) h += '<div class="off">' + L.paused + '</div>';
    var pv = Number(D.point_value) || (b.points ? b.money / b.points : 0); function mny(pts){ return egp(pts * pv); }
    h += '<div class="hero"><div class="lbl">' + L.worth + '</div><div class="big">' + egp(b.money) + '<small>EGP</small></div>' +
         '<div class="meta">' + (D.since ? L.since + ' · ' + dt(D.since, {day:"numeric", month:"short"}) : L.start) + '</div></div>';
    function stat(ic, bg, fg, label, value, foot){ return '<div class="stat"><div class="hd"><span class="ic" style="background:' + bg + ';color:' + fg + '">' + ic + '</span><span class="t">' + label + '</span></div><div class="v">' + value + '</div><div class="ft">' + foot + '</div></div>'; }
    function trend(cur, prev){ return pill(cur, prev) + '<span class="pill eq">' + L.d7 + '</span>'; }
    h += '<div class="stats">' +
      stat(IC.eye, 'var(--i2b)', 'var(--i2)', L.visits, num(a.visits), trend(sum(last7, "v"), sum(prev7, "v"))) +
      stat(IC.bag, 'var(--i1b)', 'var(--i1)', L.cb, num(a.buyers), trend(sum(last7, "o"), sum(prev7, "o"))) +
      stat(IC.star, 'var(--i3b)', 'var(--i3)', L.worth, mny(sum(last7, "p")) + '<small>EGP</small>', trend(sum(last7, "p"), sum(prev7, "p"))) +
      stat(IC.gift, 'var(--i1b)', 'var(--i1)', L.paidT, egp(a.paid) + '<small>EGP</small>', '<span class="pill eq">' + L.allTime + '</span>') +
      '</div>';
    h += '<div class="hero" style="background:linear-gradient(145deg,#1F3151,#2D4876);box-shadow:0 18px 40px rgba(31,49,81,.3)"><div class="lbl">' + L.chart + ' <small style="opacity:.8;font-weight:600">· ' + L.last30 + '</small></div>' +
         '<div class="legend"><span><i style="background:#8fd0ff"></i>' + L.cv + '</span><span><i style="background:#f7d154"></i>' + L.cb + '</span></div>' + (days.length > 1 ? bars(days) : '') + '</div>';
    h += '<div class="card"><h3>' + L.hist + '<small>' + L.last30 + '</small></h3><div class="sub" style="margin-top:6px">' + pill(sum(last7, "p"), sum(prev7, "p")) + ' ' + L.vs + '</div>' + (days.length > 1 ? line(days.map(function(x){ return {d: x.d, m: Math.round((+x.p || 0) * pv)}; }), "m") : '') + '</div>';
    h += '<div class="card"><h3>' + L.yourLink + '</h3><div class="link"><input readonly value="' + esc(D.link) + '"><button class="btn" id="cp">' + L.copy + '</button>' + (navigator.share ? '<button class="btn ghost" id="sh">' + L.share + '</button>' : '') + '</div></div>';
    h += '<div class="card"><h3>' + L.payouts + '</h3>' + ((D.payouts || []).length ? D.payouts.map(function(q){
      return '<div class="pay"><span class="ic">' + IC.gift + '</span><div class="t"><b>' + L.paid + ' · ' + dt(q.paid_at) + '</b></div><div class="p">' + egp(q.amount) + ' EGP</div></div>';
    }).join("") : '<div class="empty">' + L.noPay + '</div>') + '</div>';
    h += '<p class="note">' + L.note2 + '</p><div class="foot">Self Care Pharmacy · Hurghada</div>';
    app.innerHTML = h;
  }
  app.addEventListener("click", function(e){
    var t = e.target.closest("button"); if(!t) return;
    if(t.dataset.m){ mode = t.dataset.m; render(); return; }
    if(t.id === "cp"){ var inp = t.previousElementSibling; (navigator.clipboard ? navigator.clipboard.writeText(D.link) : Promise.reject()).catch(function(){ inp.select(); document.execCommand("copy"); }); t.textContent = L.copied; setTimeout(function(){ t.textContent = L.copy; }, 1500); }
    if(t.id === "sh"){ navigator.share({title:"Self Care Pharmacy", url:D.link}).catch(function(){}); }
  });
  /* demo dashboard for partner pitches: /partner?demo=1&lang=cs — sample numbers, no database */
  function demo(){
    var q = new URLSearchParams(location.search), lang = (q.get("lang") || "en").toLowerCase(); if(lang === "cz") lang = "cs"; if(lang === "ua") lang = "uk";
    var d0 = new Date(); d0.setHours(12, 0, 0, 0); var days = [], seed = 7;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for(var i = 29; i >= 0; i--){ var d = new Date(d0 - i * 864e5), wk = (d.getDay() === 5 || d.getDay() === 6) ? 1.35 : 1;
      var v = Math.round((18 + rnd() * 16) * wk), o = Math.round(v * (0.04 + rnd() * 0.03)), pts = o * Math.round(22 + rnd() * 14);
      days.push({d: d.toISOString().slice(0, 10), v: v, o: o, p: pts}); }
    var tp = days.reduce(function(a, x){ return a + x.p; }, 0), pay = new Date(d0 - 31 * 864e5);
    D = {name: "Demo Partner", code: 100, lang: lang, active: true, point_value: 7, link: "https://selfcare-en.com/100", since: pay.toISOString(),
         balance: {points: tp, money: tp * 7, buyers: days.reduce(function(a, x){ return a + x.o; }, 0), visits: days.reduce(function(a, x){ return a + x.v; }, 0)},
         all_time: {points: tp + 860, paid: 860 * 7, buyers: days.reduce(function(a, x){ return a + x.o; }, 0) + 31, visits: days.reduce(function(a, x){ return a + x.v; }, 0) + 690},
         days: days, payouts: [{paid_at: pay.toISOString(), points: 860, amount: 860 * 7}], demo: true};
    L = T[lang] || T.en; loc = LOC[lang] || "en-GB"; document.documentElement.lang = lang; document.title = "Self Care · " + L.partner + " · Demo";
    render();
  }
  function load(){
    if(new URLSearchParams(location.search).get("demo")){ demo(); return; }
    if(tok.length < 16){ app.innerHTML = '<div class="loading">' + L.bad + '</div>'; return; }
    fetch(SB + "/rest/v1/rpc/partner_dashboard", {method:"POST", headers:{apikey:KEY, Authorization:"Bearer " + KEY, "Content-Type":"application/json"}, body:JSON.stringify({p_token:tok})})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d){ app.innerHTML = '<div class="loading">' + L.bad + '</div>'; return; }
        D = d; L = T[d.lang] || T.en; loc = LOC[d.lang] || "en-GB";
        document.documentElement.lang = d.lang || "en"; document.title = "Self Care · " + L.partner + " · " + d.name;
        render();
      }).catch(function(){});
  }
  load(); setInterval(function(){ if(D && !D.demo && !document.hidden) load(); }, 120000);
})();
</script>
